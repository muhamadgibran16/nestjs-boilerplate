# Konfigurasi pnpm (project tunggal, bukan monorepo).

# pnpm 10 memblokir install script dependency secara default.
# Diizinkan:
# - esbuild: dipakai drizzle-kit untuk membaca file TypeScript (verifikasi binary).
onlyBuiltDependencies:
  - esbuild

# Sengaja diblokir:
# - @parcel/watcher: dipakai Jest, sudah ada binary prebuilt.
# - @scarf/scarf: telemetri dari swagger-ui.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'

# Paksa versi dependency transitif yang sudah ditambal (GHSA-q7qp-rjg7-q26m).
overrides:
  multer: ^2.5.0
